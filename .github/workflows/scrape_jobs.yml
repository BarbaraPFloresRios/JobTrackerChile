name: Scrape Jobs

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/*.csv data/recent_jobs.csv README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update jobs data"

            # A concurrent run (e.g. a manual dispatch overlapping the
            # schedule) may push while we scrape. Rebase onto the latest
            # main and retry so the push never fails with a non-fast-forward
            # rejection. On conflicting data files, prefer our fresh scrape.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt); rebasing onto latest main…"
              git pull --rebase -X theirs origin main
            done

            if [ "$pushed" = false ]; then
              echo "Failed to push after multiple attempts"
              exit 1
            fi
          fi
